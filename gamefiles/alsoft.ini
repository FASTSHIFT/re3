# OpenAL Soft config for GTA3/re3 on Raspberry Pi Zero 2 W
# Optimised to reduce CPU usage on a single 1GHz ARM core.
# See docs/06 and re3_flame.svg for profiling data.

[general]
# Match GTA3 sfx native rate (22050Hz). Avoids OpenAL doing 22050->48000
# resampling internally; only one lighter resample pass needed by PipeWire
# (22050->48000 is a simple 32/15 ratio).
frequency = 22050

# 512 samples @ 22050Hz = 23ms period. Default is 1/50th (441 samples).
# Slightly larger buffer reduces wakeup frequency and CPU overhead.
period_size = 512

# 2 periods (minimum) = 46ms total buffer. Smaller than default 3 periods.
# GTA3 audio doesn't need large pre-buffer; game loop feeds it regularly.
periods = 2

# Fastest resampler: nearest-neighbour. GTA3 sfx are already at 22050Hz
# so no resampling needed at all for most sources at this output rate.
resampler = point

# Disable real-time priority for the mixer thread.
# Default rt-prio=1 competes with the re3 main thread on a single core.
# Without rt-prio, the OS schedules it normally, reducing jitter on the
# main thread.
rt-prio = 0

# Limit concurrent sources. GTA3 uses up to ~28 sfx channels + 2 streams.
# Default 256 wastes memory and mixer overhead.
sources = 32
