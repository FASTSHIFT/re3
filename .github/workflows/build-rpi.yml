name: re3 build

# Three lean jobs:
#   format  – clang-format check on changed C/C++ files
#   linux   – native x86-64 GL3/GLFW Release build
#   rpi     – armhf cross-compile GBM+SPI Release build

on:
  pull_request:
  push:
    branches: ['**']

jobs:
  # ── format ────────────────────────────────────────────────────────────────
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 2   # need parent commit for diff

      - run: sudo apt-get install -y --no-install-recommends clang-format

      - name: Check
        run: |
          # Files changed in this push/PR vs their parent
          BASE=$(git rev-parse HEAD^ 2>/dev/null || echo "")
          if [ -z "$BASE" ]; then
            echo "Single-commit history, skipping diff check."
            exit 0
          fi
          FILES=$(git diff --name-only --diff-filter=ACM "$BASE" HEAD \
                  | grep -E '\.(cpp|c|h)$' \
                  | grep -v 'vendor/' \
                  | grep -v '_gl\.inc$' || true)
          if [ -z "$FILES" ]; then echo "No C/C++ files changed."; exit 0; fi
          echo "Checking: $FILES"
          clang-format --dry-run --Werror $FILES

  # ── linux ─────────────────────────────────────────────────────────────────
  linux:
    name: Linux GL3/GLFW
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libglfw3-dev \
            libopenal-dev \
            libmpg123-dev

      - name: Configure
        run: |
          cmake -G Ninja -B build \
            -DLIBRW_PLATFORM=GL3 \
            -DLIBRW_GL3_GFXLIB=GLFW \
            -DRE3_AUDIO=OAL \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: re3-linux-glfw
          path: build/src/re3

  # ── rpi ───────────────────────────────────────────────────────────────────
  rpi:
    name: RPi GBM+SPI (armhf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain + sysroot
        run: |
          # Cross compiler
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

          # Ubuntu 24.04 Noble: armhf packages live on ports.ubuntu.com, not
          # on security.ubuntu.com. After dpkg --add-architecture armhf the
          # default sources try to fetch armhf from security.ubuntu.com and
          # fail with 404. Fix: restrict existing sources to amd64 and add a
          # separate ports source for armhf only.
          sudo dpkg --add-architecture armhf

          # Restrict default amd64 sources so apt doesn't try armhf there
          sudo sed -i 's/^deb \(http[s]*:\/\/\(archive\|security\|cloud\)\.ubuntu\.com\/ubuntu[^ ]*\) /deb [arch=amd64,i386] \1 /' /etc/apt/sources.list 2>/dev/null || true
          # Handle deb822 format (sources.list.d/*.sources)
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] && sudo sed -i '/^Types:/a Architectures: amd64 i386' "$f" 2>/dev/null || true
          done

          # Add ports for armhf
          echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble main universe" \
            | sudo tee /etc/apt/sources.list.d/ubuntu-armhf.list
          echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe" \
            | sudo tee -a /etc/apt/sources.list.d/ubuntu-armhf.list
          echo "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-security main universe" \
            | sudo tee -a /etc/apt/sources.list.d/ubuntu-armhf.list

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgles2-mesa-dev:armhf \
            libegl-dev:armhf \
            libgbm-dev:armhf \
            libopenal-dev:armhf \
            libmpg123-dev:armhf

      - name: Configure
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_TOOLCHAIN_FILE=rpi-armhf-toolchain.cmake \
            -DRPI_SYSROOT=/usr \
            -DLIBRW_PLATFORM=GL3 \
            -DLIBRW_GL3_GFXLIB=GBM \
            -DRE3_OUTPUT_SPI=ON \
            -DRE3_RPI=ON \
            -DRE3_RPI_LEAN_FX=ON \
            -DRE3_TIMEBARS_LOG=ON \
            -DRE3_AUDIO=OAL \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-L/usr/lib/arm-linux-gnueabihf -Wl,-rpath-link,/usr/lib/arm-linux-gnueabihf"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: re3-rpi-gbm-armhf
          path: build/src/re3
