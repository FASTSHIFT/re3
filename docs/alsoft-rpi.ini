# OpenAL Soft config for GTA3/re3 on Raspberry Pi Zero 2 W
# Place this file as <GTA3 dir>/alsoft.ini (auto-loaded by OpenAL Soft).
# Optimised to reduce CPU usage on a single 1GHz ARM core.
# Profiling: ALSoftP1 thread went from ~15-20% to ~9-11% CPU.
# See docs/re3_flame.svg for the full flamegraph.

[general]
# Match GTA3 sfx native rate (22050Hz). Avoids OpenAL doing 22050->48000
# resampling internally; only one lighter resample pass needed by PipeWire
# (22050->48000 is a simple 32/15 ratio vs. up-sampling from scratch).
frequency = 22050

# 512 samples @ 22050Hz = 23ms period.
period_size = 512

# 2 periods (minimum). GTA3 audio doesn't need large pre-buffer.
periods = 2

# Fastest resampler: nearest-neighbour. GTA3 sfx are already at 22050Hz
# so no resampling needed for most sources at this output rate.
resampler = point

# Disable real-time priority for the mixer thread.
# Default rt-prio=1 competes with the re3 main thread on a single core.
rt-prio = 0

# Limit concurrent sources. GTA3 uses ~28 sfx channels + 2 streams.
# Default 256 wastes memory and mixer overhead.
sources = 32
